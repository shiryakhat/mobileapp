# Attach a signed, sideloadable Android APK (+ checksum) to every published
# GitHub Release — same idea as moav-deploy, adapted to Expo/EAS.
#
# The APK is built with `eas build --local` using the preview profile
# (buildType: apk) and signed with the EAS-managed release keystore via
# EXPO_TOKEN — no extra keystore secret, and no EAS cloud build quota is used.
# The Play AAB + TestFlight path stays in release.yml; this only produces the
# GitHub artifact for direct install / sideloading.
#
# Verify a downloaded APK with:  sha256sum -c SHA256SUMS
name: GitHub Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Guard — EXPO_TOKEN present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set. See docs/release.md."
            exit 1
          fi

      - name: Build signed APK (eas local, remote keystore)
        run: |
          set -euo pipefail
          name="shiryakhat-${GITHUB_REF_NAME}.apk"
          npx eas-cli build \
            --local \
            --platform android \
            --profile preview \
            --non-interactive \
            --output "${RUNNER_TEMP}/${name}"
          ls -la "${RUNNER_TEMP}/${name}"

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          sha256sum shiryakhat-*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiryakhat-apk-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/shiryakhat-*.apk
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/shiryakhat-*.apk
            ${{ runner.temp }}/SHA256SUMS
